# herdr-file-viewer config: $(herdr plugin config-dir herdr-file-viewer)/config.toml
# Full key list: config.example.toml in the plugin root. Relaunch the viewer after editing.
editor = "hx"                # `e` opens the selected file here
open = "herdr-fv-open"       # `O`: image split / GitHub-style md preview / editor (SPEC F-1, F-2)
show_ignored = true          # show gitignored files at startup (`i` toggles)
#update_check = false        # disables release checks and the "Spotlight" banner
